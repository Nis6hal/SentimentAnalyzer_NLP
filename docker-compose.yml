version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sentimentiq_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sentimentiq}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentimentiq_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/sentimentiq
      - MODEL_TYPE=champion
      - DEVICE=cpu
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - ./ml/experiments:/app/ml/experiments

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentimentiq_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

  mlflow:
    image: python:3.11-slim
    container_name: sentimentiq_mlflow
    restart: always
    working_dir: /app
    volumes:
      - ./ml/experiments:/app/ml/experiments
    command: >
      sh -c "pip install mlflow && mlflow server --backend-store-uri sqlite:///ml/experiments/mlflow.db --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"

volumes:
  postgres_data:

